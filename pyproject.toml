[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faradaymr"
version = "0.2.0"
description = "Framework para simular observaciones de radioastronomía (RM de Faraday, polarización sincrotrón) de plasmas magnetizados."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "astropy",
]

[project.optional-dependencies]
gpu = ["cupy"]
dev = ["pytest", "matplotlib"]

# El código vive en src/*.py directamente (no en src/faradaymr/*.py), así
# que `packages.find` con where=["src"] es ambiguo: encuentra las subcajas
# con nombre propio (instrument, fields, simulation) pero no sabe que el
# contenido suelto de src/ es el paquete "faradaymr" en sí. Aquí se lo
# decimos de forma explícita: el paquete `faradaymr` y sus subpaquetes
# viven todos bajo la carpeta `src`.
[tool.setuptools]
packages = [
    "faradaymr",
    "faradaymr.instrument",
    "faradaymr.fields",
    "faradaymr.simulation",
]

[tool.setuptools.package-dir]
faradaymr = "src"
